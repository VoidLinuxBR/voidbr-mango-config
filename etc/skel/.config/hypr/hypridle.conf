# VoidBR Mango - hypridle
# 5 min parado: apaga a tela | 10 min: bloqueia
# Pausado enquanto o botao "cafe" do Waybar estiver ligado ou um video tocar.
general {
    lock_cmd = /usr/local/bin/voidbr-lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = /usr/local/bin/voidbr-monitors on
}

listener {
    timeout = 300
    on-timeout = /usr/local/bin/voidbr-monitors off
    on-resume = /usr/local/bin/voidbr-monitors on
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}
