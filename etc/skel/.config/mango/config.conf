# ===================================================================
# VoidBR Mango - sessao (Waybar)
# ===================================================================

# Carrega todas as configuracoes base (monitores, efeitos, layouts, atalhos)
source=~/.config/mango/base.conf

# Cores das bordas seguindo o tema (gerado por voidbr-theme)
source_optional=~/.config/mango/colors.conf

# Autostart para o ambiente independente (Waybar)
exec_once=waybar
exec_once=mako
exec_once=/usr/local/bin/voidbr-session-start

# Gerenciador de clipboard
exec_once=wl-paste --type text --watch cliphist store
exec_once=wl-paste --type image --watch cliphist store


# Menu de aplicativos (Rofi) via SUPER ou ALT
bind=SUPER,space,spawn,voidbr-rofi -show drun
bind=Alt,space,spawn,voidbr-rofi -show drun

# Seletor visual de Papel de Parede em GTK4 (Super + W ou Alt + W)
bind=SUPER,w,spawn,/usr/local/bin/voidbr-wallpaper-picker
bind=Alt,w,spawn,/usr/local/bin/voidbr-wallpaper-picker

# Seletor grafico de layouts de Tiling em GTK4 (Super + L ou Alt + L)
bind=SUPER,l,spawn,/usr/local/bin/voidbr-mango-layout-picker
bind=Alt,l,spawn,/usr/local/bin/voidbr-mango-layout-picker

# Ajuda com janela de atalhos
bind=SUPER,F1,spawn,/usr/local/bin/voidbr-mango-shortcuts

# Teclas Multimidia (volume com aviso na tela e limite de 100%: voidbr-osd)
bind=NONE,XF86AudioRaiseVolume,spawn,voidbr-osd volume +
bind=NONE,XF86AudioLowerVolume,spawn,voidbr-osd volume -
bind=NONE,XF86AudioMute,spawn,voidbr-osd volume mudo
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioPrev,spawn,playerctl previous
bind=NONE,XF86AudioStop,spawn,playerctl stop

# Teclas de Brilho (via brightnessctl)
bind=NONE,XF86MonBrightnessUp,spawn,voidbr-osd brilho +
bind=NONE,XF86MonBrightnessDown,spawn,voidbr-osd brilho -

# Menu de temas de cores (voidbr-theme)
bind=SUPER+SHIFT,t,spawn,/usr/local/bin/voidbr-theme --menu

# Bloqueio de tela e historico da area de transferencia
bind=SUPER,Escape,spawn,/usr/local/bin/voidbr-lock
bind=SUPER,v,spawn,/usr/local/bin/voidbr-clipboard

# Capturas de tela (Screenshots)
bind=NONE,Print,spawn,/usr/local/bin/voidbr-screenshot tela
bind=SUPER+SHIFT,s,spawn,/usr/local/bin/voidbr-screenshot area

# Menu de captura e gravacao (para a gravacao se estiver gravando)
bind=SUPER+SHIFT,r,spawn,/usr/local/bin/voidbr-capture-menu
