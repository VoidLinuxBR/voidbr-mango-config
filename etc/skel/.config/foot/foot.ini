# ===================================================================
# Foot Terminal Configuration - Tokyo Night com Transparência e Blur
# ===================================================================

font=monospace:size=11
# Negrito nas cores 0-7 usa a versao clara (o .bashrc do VoidBR imprime em "preto negrito")
bold-text-in-bright=palette-based
pad=12x12

# Cores geradas por voidbr-theme (~/.config/voidbr/colors.ini)
include=~/.config/foot/colors.ini

[colors-dark]
# Nível de transparência (0.0 = transparente, 1.0 = opaco)
alpha=0.82

[cursor]
style=beam
blink=yes

[mouse]
hide-when-typing=yes
