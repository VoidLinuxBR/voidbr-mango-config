# VoidBR Mango - hyprlock (cores em ~/.config/voidbr/colors.ini)
source = ~/.config/hypr/colors.conf
general {
    hide_cursor = true
    grace = 0
}

background {
    path = ~/.local/share/backgrounds/current.png
    blur_passes = 3
    blur_size = 6
    brightness = 0.6
}

label {
    text = $TIME
    color = $fg
    font_size = 90
    font_family = Noto Sans Bold
    position = 0, 160
    halign = center
    valign = center
}

label {
    text = cmd[update:60000] date +"%A, %d de %B"
    color = $accent
    font_size = 20
    font_family = Noto Sans
    position = 0, 70
    halign = center
    valign = center
}

input-field {
    size = 300, 50
    outline_thickness = 2
    outer_color = $accent
    inner_color = $bg_alpha
    font_color = $fg
    check_color = $yellow
    fail_color = $red
    fail_text = Senha incorreta
    placeholder_text = <i>Senha...</i>
    rounding = 16
    dots_center = true
    fade_on_empty = false
    position = 0, -40
    halign = center
    valign = center
}
